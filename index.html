<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Greenline WMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      IBM Plex Sans Thai carries both scripts, so Thai and Latin share one
      rhythm instead of falling back to two unrelated faces. JetBrains Mono is
      the companion for codes, SKUs and lot numbers.

      Only Regular and Bold are fetched, which fixes how the in-between weights
      resolve: 500 falls to Regular and 600 rises to Bold, so the UI has two
      weights rather than four. The family does ship real 500 and 600 faces —
      add `;500;600` below to bring the finer hierarchy back. (There is no 800;
      the two places that ask for it render as Bold.)
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
